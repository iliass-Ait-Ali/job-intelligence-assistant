# Learning knowledge base for the skill-gap planner (Module 5).
#
# implies:        knowing THIS skill is evidence of partial knowledge of those (PostgreSQL => SQL,
#                 but NOT SQL => PostgreSQL). Used for the "partially covered" status.
# prerequisites:  learn these first (used to order the learning plan, topological sort).
# resources:      official documentation or well-known free material only. Links were chosen to be
#                 stable top-level pages; they are suggestions, not endorsements.
# project:        a portfolio project that produces visible evidence of the skill.
# interview:      typical technical questions to prepare.
#
# Skills absent from this file fall back to the defaults of their taxonomy category (bottom).

skills:
  Python:
    implies: []
    prerequisites: []
    resources:
      - {title: "The Python Tutorial (official)", url: "https://docs.python.org/3/tutorial/", type: docs}
      - {title: "Kaggle Learn - Python", url: "https://www.kaggle.com/learn/python", type: course}
    project: "Write a small CLI tool with type hints, logging, a config file and pytest tests; publish it on GitHub with CI."
    interview:
      - "Difference between a list, a tuple, a set and a dict; complexity of membership tests?"
      - "What are generators and when do they save memory?"
      - "Explain mutable default arguments and how to avoid the bug."
  SQL:
    implies: []
    prerequisites: []
    resources:
      - {title: "PostgreSQL tutorial (official docs)", url: "https://www.postgresql.org/docs/current/tutorial.html", type: docs}
      - {title: "Kaggle Learn - Intro to SQL", url: "https://www.kaggle.com/learn/intro-to-sql", type: course}
      - {title: "Kaggle Learn - Advanced SQL", url: "https://www.kaggle.com/learn/advanced-sql", type: course}
    project: "Model a small business dataset (orders, customers, products) and answer 10 analytical questions with window functions and CTEs."
    interview:
      - "INNER vs LEFT JOIN: what happens to rows without a match?"
      - "Write a query returning the top-3 products per category (window functions)."
      - "WHERE vs HAVING? What does an index speed up, and what does it slow down?"
  PostgreSQL:
    implies: [SQL]
    prerequisites: [SQL]
    resources:
      - {title: "PostgreSQL documentation", url: "https://www.postgresql.org/docs/current/", type: docs}
    project: "Deploy PostgreSQL in Docker, load a public dataset, add indexes and compare EXPLAIN ANALYZE plans."
    interview:
      - "What is MVCC and why does PostgreSQL need VACUUM?"
      - "B-tree vs GIN index: which for full-text or JSONB search?"
  MySQL: {implies: [SQL], prerequisites: [SQL]}
  SQL Server: {implies: [SQL], prerequisites: [SQL]}
  Oracle: {implies: [SQL], prerequisites: [SQL]}
  SQLite: {implies: [SQL], prerequisites: [SQL]}
  pandas:
    implies: [Python, Data analysis]
    prerequisites: [Python]
    resources:
      - {title: "pandas - Getting started", url: "https://pandas.pydata.org/docs/getting_started/index.html", type: docs}
      - {title: "Kaggle Learn - Pandas", url: "https://www.kaggle.com/learn/pandas", type: course}
    project: "Clean and analyse a messy public dataset (missing values, types, joins, groupby) in a documented notebook."
    interview:
      - "loc vs iloc? How do you avoid SettingWithCopy problems?"
      - "How would you process a CSV that does not fit in memory?"
  NumPy: {implies: [Python], prerequisites: [Python]}
  Polars: {implies: [Python, Data analysis], prerequisites: [Python]}
  scikit-learn:
    implies: [Machine learning, Python]
    prerequisites: [Python, Machine learning]
    resources:
      - {title: "scikit-learn User Guide", url: "https://scikit-learn.org/stable/user_guide.html", type: docs}
      - {title: "Kaggle Learn - Intro to Machine Learning", url: "https://www.kaggle.com/learn/intro-to-machine-learning", type: course}
    project: "Build a leakage-free Pipeline + ColumnTransformer with cross-validated hyper-parameter search and a model card."
    interview:
      - "Why must preprocessing be fitted inside cross-validation folds?"
      - "Bias-variance trade-off: how do regularisation and model complexity move it?"
  Machine learning:
    implies: []
    prerequisites: [Python, Statistics]
    resources:
      - {title: "Google Machine Learning Crash Course", url: "https://developers.google.com/machine-learning/crash-course", type: course}
      - {title: "An Introduction to Statistical Learning (free book)", url: "https://www.statlearning.com/", type: book}
    project: "End-to-end tabular project: baseline, feature engineering, model comparison with honest validation, error analysis."
    interview:
      - "Precision vs recall: which matters for fraud detection and why?"
      - "How do you detect and handle data leakage?"
      - "Explain gradient boosting in two minutes."
  Deep learning:
    implies: [Machine learning]
    prerequisites: [Machine learning, Python]
    resources:
      - {title: "Dive into Deep Learning (free book)", url: "https://d2l.ai/", type: book}
      - {title: "fast.ai - Practical Deep Learning", url: "https://course.fast.ai/", type: course}
    project: "Train a small CNN or transformer from scratch, then fine-tune a pre-trained model; compare learning curves."
    interview:
      - "Why do residual connections help train deep networks?"
      - "What do batch normalisation and dropout do?"
  PyTorch:
    implies: [Deep learning, Python]
    prerequisites: [Python, Deep learning]
    resources:
      - {title: "PyTorch Tutorials (official)", url: "https://pytorch.org/tutorials/", type: docs}
    project: "Implement a training loop with a custom Dataset, mixed precision and checkpointing; track runs with MLflow."
    interview:
      - "What does autograd record, and when do you call optimizer.zero_grad()?"
      - "model.train() vs model.eval()?"
  TensorFlow:
    implies: [Deep learning, Python]
    prerequisites: [Python, Deep learning]
    resources:
      - {title: "TensorFlow tutorials (official)", url: "https://www.tensorflow.org/tutorials", type: docs}
    project: "Rebuild the same model in Keras/TensorFlow and serve it with a REST endpoint."
    interview: ["Eager vs graph execution (tf.function)?"]
  Keras: {implies: [Deep learning, Python], prerequisites: [Python, Deep learning]}
  XGBoost: {implies: [Machine learning], prerequisites: [Machine learning]}
  LightGBM: {implies: [Machine learning], prerequisites: [Machine learning]}
  Statistics:
    implies: []
    prerequisites: []
    resources:
      - {title: "OpenIntro Statistics (free book)", url: "https://www.openintro.org/book/os/", type: book}
      - {title: "Khan Academy - Statistics and probability", url: "https://www.khanacademy.org/math/statistics-probability", type: course}
    project: "Design and analyse an A/B test on simulated data: power analysis, test choice, confidence intervals."
    interview:
      - "What does a p-value mean - and what does it NOT mean?"
      - "Confidence interval vs credible interval?"
  A/B testing:
