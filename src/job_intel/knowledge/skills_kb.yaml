# Defaults by taxonomy category, used when a skill has no entry above.
categories:
  programming_language:
    project: "Re-implement a small tool you already know in this language, with tests."
    interview: ["What problems is this language particularly good at, and why?"]
  framework_library:
    project: "Use the library in a small, tested project and document the design choices."
    interview: ["What problem does this library solve, and what are its alternatives?"]
  data_platform:
    project: "Build a small pipeline on the platform with a public dataset and document costs/limits."
    interview: ["How does this platform scale and what does it cost?"]
  database:
    project: "Model a dataset in this database, index it, and benchmark three typical queries."
    interview: ["When would you choose this database over a relational one?"]
  bi_tool:
    project: "Build a small dashboard on a public dataset with a clear data model."
    interview: ["How do you keep a dashboard's numbers consistent with the source?"]
  cloud_devops:
    project: "Deploy a small service with this tool and describe it as code."
    interview: ["What failure modes does this tool protect you from?"]
  genai:
    project: "Build a small, evaluated prototype (with a test set) using this technique."
    interview: ["How do you evaluate it and what are its failure modes?"]
  concept:
    project: "Write a notebook that explains and applies the concept on real data."
    interview: ["Explain the concept to a non-specialist, then give its main pitfall."]
  tool:
    project: "Use the tool in a small project and write down what you learned."
    interview: ["How have you used it, and what would you do differently?"]
