    interview: ["Why is random k-fold CV wrong for time series?", "What is stationarity?"]
  Forecasting: {implies: [Time series], prerequisites: [Time series]}
  Data analysis:
    implies: []
    prerequisites: [SQL]
    resources:
      - {title: "Kaggle Learn - Data Visualization", url: "https://www.kaggle.com/learn/data-visualization", type: course}
