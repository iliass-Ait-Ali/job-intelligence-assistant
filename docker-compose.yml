# docker compose run --rm pipeline     # 1. collect + enrich + index (writes ./data)
# docker compose up -d api ui          # 2. API on :8000/docs, UI on :8501
# docker compose --profile llm up -d   # optional local LLM (then: docker compose exec ollama ollama pull llama3.2:3b)

x-app: &app
  build: .
  image: job-intel:1.0.0
  volumes:
    - ./data:/app/data            # listings, SQLite, vector index (never baked into the image)
    - models:/models              # Hugging Face model cache
  environment:
    JOBINTEL_OLLAMA_URL: http://ollama:11434
    JOBINTEL_LLM_TRUSTED_HOSTS: ollama   # the compose service below: a machine you control
    JOBINTEL_CONTACT: ${JOBINTEL_CONTACT:-}

services:
  pipeline:
    <<: *app
    profiles: ["pipeline"]
    command: ["sh", "-c", "jobintel collect && jobintel enrich && jobintel index"]

  api:
    <<: *app
    ports: ["127.0.0.1:8000:8000"]
    command: ["jobintel", "api", "--host", "0.0.0.0", "--port", "8000"]

  ui:
    <<: *app
    ports: ["127.0.0.1:8501:8501"]
    command: ["jobintel", "ui", "--host", "0.0.0.0", "--port", "8501"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health')"]

  ollama:
    image: ollama/ollama:0.5.7
    profiles: ["llm"]
    volumes: ["ollama:/root/.ollama"]

volumes:
  models:
  ollama:
